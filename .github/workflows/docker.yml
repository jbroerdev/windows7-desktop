name: Docker build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RDP_SERVICE_SECRET: ci-only-rdp-service-secret-not-for-production
      MESSENGER_SERVICE_SECRET: ci-only-messenger-service-key-not-for-production
    steps:
      - uses: actions/checkout@v6
      - name: Validate upgrade helper
        run: bash -n scripts/upgrade-from-explorer-share.sh
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate optional Office Compose
        run: docker compose -f compose.yaml -f compose.office.yaml config --quiet
      - name: Validate optional Messenger Compose
        run: docker compose -f compose.yaml -f compose.messenger.yaml config --quiet
      - name: Validate optional RDP Compose
        run: docker compose -f compose.yaml -f compose.rdp.yaml config --quiet
      - name: Build RDP service and run its isolation tests
        run: docker compose -f compose.yaml -f compose.rdp.yaml build remote-desktop
      - name: Verify real RDP in an isolated Docker network
        run: |
          trap 'docker compose -p rdp-integration -f compose.rdp-test.yaml logs --no-color; docker compose -p rdp-integration -f compose.rdp-test.yaml down' EXIT
          docker compose -p rdp-integration -f compose.rdp-test.yaml up -d --build
          for attempt in 1 2 3; do
            if docker compose -p rdp-integration -f compose.rdp-test.yaml exec -T remote-desktop node --input-type=module < scripts/rdp-smoke.mjs; then
              docker compose -p rdp-integration -f compose.rdp-test.yaml exec -T test-rdp grep -q 'Session started successfully for user rdptest' /var/log/xrdp-sesman.log
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Prepare host bind directory
        run: sudo install -d -o 1000 -g 1000 /Explorer
      - name: Build and run integration tests
        run: docker compose build
      - name: Build Messenger and run its isolation tests
        run: docker compose -f compose.yaml -f compose.messenger.yaml build live-messenger
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ZimaOS image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jbroerdev/windows7-desktop:latest
            ghcr.io/jbroerdev/windows7-desktop:${{ github.sha }}
      - name: Start container and wait for health check
        run: docker compose -f compose.yaml -f compose.ci.yaml -f compose.messenger.yaml up -d --wait --wait-timeout 90
      - name: Check HTTP and filesystem
        run: |
          curl --fail --silent http://127.0.0.1:3000/api/session
          curl --fail --silent http://127.0.0.1:3000/api/drives
          docker compose exec -T explorer node -e "const fs=require('node:fs');fs.accessSync('/Explorer/Users',fs.constants.W_OK);if(process.getuid()===0)process.exit(1)"
          docker compose exec -T explorer node scripts/docker-smoke.mjs
          docker compose exec -T explorer node -e "fetch('http://127.0.0.1:3000/api/messenger/share/state').then(async r=>{const s=await r.json();if(!r.ok||s.self?.kind!=='guest'||s.canSend||s.connection!=='setup')process.exit(1)}).catch(()=>process.exit(1))"
      - name: Container logs
        if: always()
        run: docker compose -f compose.yaml -f compose.messenger.yaml logs --no-color
