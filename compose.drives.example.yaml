# Copy to compose.drives.yaml and mount the disks into the host folders below /Explorer.
# Optional explicit disk binds; the main /Explorer bind already includes existing submounts.
services:
  explorer:
    volumes:
      - type: bind
        source: /Explorer/D-Daten
        target: /Explorer/D-Daten
        bind:
          create_host_path: false
      - type: bind
        source: /Explorer/E-Archiv
        target: /Explorer/E-Archiv
        bind:
          create_host_path: false
