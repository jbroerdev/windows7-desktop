name: windows7-desktop
services:
  explorer:
    build: .
    image: windows7-desktop:local
    restart: unless-stopped
    init: true
    ports:
      - "${EXPLORER_BIND_ADDRESS:-127.0.0.1}:${EXPLORER_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      EXPLORER_ROOT: /Explorer
      FFMPEG_ENABLED: ${FFMPEG_ENABLED:-1}
      FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
      FFMPEG_MAX_WIDTH: ${FFMPEG_MAX_WIDTH:-1280}
      FFMPEG_MAX_HEIGHT: ${FFMPEG_MAX_HEIGHT:-720}
      FFMPEG_MAX_PROCESSES: ${FFMPEG_MAX_PROCESSES:-2}
      FFMPEG_STARTUP_TIMEOUT: ${FFMPEG_STARTUP_TIMEOUT:-30}
      DATA_DIR: /Explorer/.explorer
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - type: bind
        source: ${EXPLORER_PATH:-/Explorer}
        target: /Explorer
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
