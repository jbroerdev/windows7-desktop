services:
  explorer:
    environment:
      SPOTIFY_SERVICE_URL: http://spotify:3007
      SPOTIFY_SERVICE_SECRET: ${SPOTIFY_SERVICE_SECRET:?Set SPOTIFY_SERVICE_SECRET}
    depends_on:
      spotify:
        condition: service_healthy
  spotify:
    image: windows7-spotify:local
    build: ./services/spotify
    restart: unless-stopped
    environment:
      SPOTIFY_SERVICE_SECRET: ${SPOTIFY_SERVICE_SECRET:?Set SPOTIFY_SERVICE_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-https://explorer.xserverx.app/api/spotify/callback}
    volumes:
      - spotify-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  spotify-data:
