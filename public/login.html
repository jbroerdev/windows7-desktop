<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anmelden – Explorer Share</title><link rel="stylesheet" href="/login.css"></head><body><main class="logon"><section class="account"><button id="portrait" class="portrait" title="Profilbild ändern" disabled><img id="avatar" src="/avatars/user.png" alt="Profilbild"></button><h1 id="accountname">Willkommen</h1><form id="loginform"><label class="sr" for="username">Benutzername</label><input id="username" placeholder="Benutzername" autocomplete="username" required minlength="2"><div class="passwordrow"><label class="sr" for="password">Passwort</label><input id="password" type="password" placeholder="Passwort" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit" aria-label="Anmelden">➜</button></div><p id="hint"></p></form><p id="message" role="status"></p><div id="signedin" hidden><a class="glassbutton" href="/">Dateien öffnen</a><button id="choose" class="glassbutton">Profilbild ändern</button><button id="manageusers" class="glassbutton" hidden>Benutzer verwalten</button><button id="editshare" class="glassbutton" hidden>Share-Desktop bearbeiten</button><button id="logout" class="glassbutton">Abmelden</button></div><button id="switchuser" class="glassbutton" hidden>Benutzer wechseln</button><div id="accountlist" hidden></div><a id="back" href="/C/Users/share/">Öffentlichen Share-Desktop öffnen</a></section><section id="pictures" hidden><h2>Wählen Sie ein Bild für Ihr Konto</h2><div id="gallery"></div><label class="glassbutton uploadlabel">Eigenes Bild auswählen<input id="uploadavatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden></label><button id="closepictures" class="glassbutton">Schließen</button></section><section id="userspanel" hidden><h2>Benutzer verwalten</h2><div id="userslist"></div><form id="userform"><label>Benutzername<input id="newusername" required pattern="[a-zA-Z0-9_-]{2,40}" autocomplete="off"></label><label>Passwort (mindestens 12 Zeichen)<input id="newuserpassword" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button class="glassbutton" type="submit">Benutzer anlegen</button><button id="closeusers" type="button" class="glassbutton">Schließen</button><p id="usererror" role="status"></p></form></section></main><footer><span class="brandmark">▦</span><span>Explorer Share <small>Windows 7 Edition</small></span></footer><script src="/login.js" type="module"></script></body></html>
