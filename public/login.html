<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico?v=1" type="image/vnd.microsoft.icon"><title>Anmelden – Explorer Share</title><link rel="stylesheet" href="/login.css"><link rel="preload" as="image" href="/icons/logon.png"><link rel="preload" as="image" href="/icons/session-spinner.gif?v=1"><link rel="stylesheet" href="/session-loading.css"></head><body><section id="session-loading" role="status" aria-live="polite" aria-label="Ladevorgang" tabindex="-1"><div class="session-loading-line"><span class="session-loading-spinner" aria-hidden="true"></span><span data-loading-message>Bitte warten …</span></div><div class="session-loading-detail" data-loading-detail></div><div class="session-loading-brand" aria-hidden="true"><span class="session-loading-mark"></span><span>Windows 7</span><small>Desktop</small></div></section><main class="logon"><section class="account"><button id="portrait" class="portrait" title="Profilbild ändern" disabled><img id="avatar" src="/avatars/user.png" alt="Profilbild"></button><h1 id="accountname">Willkommen</h1><form id="loginform"><label class="sr" for="username">Benutzername</label><input id="username" placeholder="Benutzername" autocomplete="username" required minlength="2"><div class="passwordrow"><label class="sr" for="password">Passwort</label><input id="password" type="password" placeholder="Passwort" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit" aria-label="Anmelden">➜</button></div><p id="hint"></p></form><p id="message" role="status"></p><div id="signedin" hidden><nav class="security-list" aria-label="Windows-Sicherheit"><button id="security-lock" class="security-action">Computer sperren</button><button id="security-switch" class="security-action">Benutzer wechseln</button><button id="logout" class="security-action">Abmelden</button><button id="security-password" class="security-action">Kennwort ändern …</button><a id="security-taskmanager" class="security-action" href="/?security=taskmgr">Task-Manager starten</a></nav><a id="security-cancel" class="glassbutton security-cancel" href="/">Abbrechen</a><details class="security-account-tools"><summary>Kontoeinstellungen</summary><button id="choose" class="glassbutton">Profilbild ändern</button><button id="manageusers" class="glassbutton" hidden>Benutzer verwalten</button><button id="editshare" class="glassbutton" hidden>Share-Desktop bearbeiten</button></details></div><section id="passwordpanel" hidden><h2>Kennwort ändern</h2><form id="passwordform"><label class="sr" for="oldpassword">Bisheriges Kennwort</label><input id="oldpassword" type="password" placeholder="Bisheriges Kennwort" autocomplete="current-password" required maxlength="256"><label class="sr" for="newpassword">Neues Kennwort</label><input id="newpassword" type="password" placeholder="Neues Kennwort" autocomplete="new-password" required minlength="1" maxlength="256"><label class="sr" for="confirmpassword">Kennwort bestätigen</label><input id="confirmpassword" type="password" placeholder="Kennwort bestätigen" autocomplete="new-password" required minlength="1" maxlength="256"><button class="glassbutton" type="submit">Kennwort ändern</button><button id="passwordcancel" class="glassbutton" type="button">Abbrechen</button></form></section><div id="accountlist" hidden></div><button id="switchuser" class="glassbutton" hidden>Benutzer wechseln</button><a id="back" href="/C/Users/share/">Öffentlichen Share-Desktop öffnen</a></section><section id="pictures" hidden><h2>Wählen Sie ein Bild für Ihr Konto</h2><div id="gallery"></div><label class="glassbutton uploadlabel">Eigenes Bild auswählen<input id="uploadavatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden></label><button id="closepictures" class="glassbutton">Schließen</button></section><section id="userspanel" hidden><h2>Benutzer verwalten</h2><div id="userslist"></div><form id="userform"><label>Benutzername<input id="newusername" required pattern="[a-zA-Z0-9_-]{2,40}" autocomplete="off"></label><label>Passwort<input id="newuserpassword" type="password" required minlength="1" maxlength="256" autocomplete="new-password"></label><button class="glassbutton" type="submit">Benutzer anlegen</button><button id="closeusers" type="button" class="glassbutton">Schließen</button><p id="usererror" role="status"></p></form></section></main><footer><span class="brandmark">▦</span><span><span id="brandname">Explorer Share</span> <small id="brandedition">Windows 7 Edition</small></span></footer><script src="/login.js" type="module"></script></body></html>
