<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Mario 64</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;object-fit:contain;display:block;outline:none}#status{position:absolute;left:20px;top:20px;color:white;font:14px Segoe UI,sans-serif}</style><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><div id="status">Spiel wird geladen …</div><script>
var desktopStarted=false;
window.desktopAudioContexts=[];
var desktopAudioOriginal=AudioNode.prototype.connect;
AudioNode.prototype.connect=function(target){if(target instanceof AudioDestinationNode&&window.desktopAudioConnect&&!this.context.desktopRouting){var context=this.context;var output=context.desktopOutput;if(!output){window.desktopAudioContexts.push(context);context.desktopRouting=true;try{context.desktopOutput=window.desktopAudioConnect(context);}finally{context.desktopRouting=false;}output=context.desktopOutput;}return desktopAudioOriginal.call(this,output);}return desktopAudioOriginal.apply(this,arguments);};
var Module={canvas:document.getElementById('canvas'),desktopSave:null,desktopPaused:false,noInitialRun:true,desktopSaved:function(save){parent.postMessage({type:'sm64-save',save:save},location.origin)},onRuntimeInitialized:function(){parent.postMessage({type:'sm64-ready'},location.origin)},setStatus:function(text){document.getElementById('status').textContent=text},onAbort:function(){parent.postMessage({type:'sm64-error',message:'Das Spiel konnte nicht gestartet werden.'},location.origin)}};
function desktopSetPause(value){Module.desktopPaused=value;window.desktopAudioContexts.forEach(function(context){(value?context.suspend():context.resume()).catch(function(){})})}
addEventListener('message',function(e){if(e.origin!==location.origin||e.source!==parent)return;var d=e.data||{};if(d.type==='sm64-start'&&!desktopStarted){desktopStarted=true;Module.desktopSave=d.save||null;Module.callMain([]);document.getElementById('status').hidden=true;Module.canvas.focus()}if(d.type==='sm64-pause'){desktopSetPause(!!d.paused);if(!d.paused)Module.canvas.focus()}});
addEventListener('blur',function(){desktopSetPause(true);parent.postMessage({type:'sm64-paused'},location.origin)});
</script>{{{ SCRIPT }}}</html>
